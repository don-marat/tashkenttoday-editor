services:
  - type: web
    name: tashkent-editor-bot-v3
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot_v3.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    # Render бесплатный тариф засыпает через 15 мин без трафика, 
    # но для Telegram бота это ок - он проснется при новом сообщении
    # Если хочешь чтобы не засыпал - поставь план Starter $7/мес
